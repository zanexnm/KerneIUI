apply plugin: 'com.android.application'

android {
    namespace 'com.liel.kernelui'
    compileSdk 34

    defaultConfig {
        applicationId "com.liel.kernelui"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}